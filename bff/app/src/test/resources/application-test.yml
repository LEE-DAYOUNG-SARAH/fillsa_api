spring:
  application:
    name: fillsa_api

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

  # 테스트는 H2 이고 스키마를 엔티티에서 생성한다(create-drop).
  # 마이그레이션 스크립트는 MySQL/TiDB 방언이라 H2 에서 실행하면 깨진다.
  flyway:
    enabled: false

  jackson:
    time-zone: Asia/Seoul

  servlet:
    multipart:
      max-file-size: 2MB

  data:
    redis:
      host: localhost
      port: 6380

jwt:
  secret: dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tZ2VuZXJhdGlvbi12ZXJ5LWxvbmctYW5kLXNlY3VyZS1rZXktZm9yLXRlc3QtZW52aXJvbm1lbnQ=
  access-token-validity: 900000   # 15분
  refresh-token-validity: 604800000   # 7일

oauth:
  kakao:
    client-id: test
    client-secret: test
    redirect-uri: test
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
  google:
    client-id: test
    client-secret: test
    redirect-uri: test
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo

cloud:
  aws:
    credentials:
      access-key: test
      secret-key: test
    region:
      static: test
    s3:
      bucket: test
  # R2 전환 시 테스트 프로필 설정이 누락되어 s3Client 빈 생성이 실패했다.
  # 실제 호출은 하지 않으므로 더미값으로 컨텍스트만 뜨게 한다.
  r2:
    account-id: test
    access-key: test
    secret-key: test
    bucket: test
    public-url: https://test.r2.local

springdoc:
  swagger-ui:
    path: /test/swagger-ui.html
    url: /test/v3/api-docs
  api-docs:
    path: /test/v3/api-docs

fillsa:
  security:
    actuator-path: /test
    swagger-path: /test
  ko-author-url: https://ko.wikipedia.org/wiki/
  en-author-url: https://en.wikipedia.org/wiki/
  withdraw-url: test