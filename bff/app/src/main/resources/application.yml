server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: fillsa_api

  datasource:
    url: jdbc:mysql://localhost:3306/fillsa_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 커넥션을 처음부터 auto-commit=false 로 둔다. 기본값(true)이면 트랜잭션마다
    # `SET autocommit=0` / `SET autocommit=1` 이 TiDB 로 왕복한다(1회 ≈ 80ms).
    # 아래 hibernate.connection.provider_disables_autocommit 과 반드시 짝으로 쓴다.
    hikari:
      auto-commit: false

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        # 풀이 이미 auto-commit=false 를 보장하므로 Hibernate 가 확인·전환하지 않게 한다.
        # 부수 효과로 커넥션 획득이 첫 쿼리 시점까지 늦춰진다.
        connection:
          provider_disables_autocommit: true
    hibernate:
      ddl-auto: none
    open-in-view: false

  # 스키마 마이그레이션 — bff:app 만 소유한다. admin 은 같은 DB 에 붙으므로 비활성.
  # 신규 마이그레이션은 V2 부터. V1 은 Flyway 도입 이전의 기존 스키마를 가리킨다.
  #
  # ⚠️ 운영 DB(TiDB)에는 부트스트랩 SQL 을 먼저 적용해야 한다.
  #    docs/migration/2026-09-flyway-bootstrap.md
  #
  #    Flyway 가 이력 테이블을 스스로 만들 때 CREATE TABLE ... AS SELECT 를 쓰는데
  #    TiDB 가 이 구문을 지원하지 않아 기동이 실패한다(ErrorCode 1105).
  #    이력 테이블과 baseline 행을 미리 넣어두면 Flyway 가 생성 구문을 타지 않는다.
  #
  #    baseline-on-migrate 는 이력 테이블이 "없을 때"만 동작하므로, 부트스트랩을
  #    적용한 뒤에는 관여하지 않는다. 그래도 남겨두는 이유는 신규 환경(로컬 MySQL 등)에서
  #    이력 테이블 없이 뜨는 경우를 위해서다.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "existing schema before flyway"
    locations: classpath:db/migration
    # 이미 적용된 마이그레이션 파일을 나중에 수정하면 부팅을 실패시킨다.
    validate-on-migrate: true
    # 운영 스키마를 임의로 정리하지 않는다.
    clean-disabled: true

  jackson:
    time-zone: Asia/Seoul

  servlet:
    multipart:
      max-file-size: 2MB

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret:
  access-token-validity: 10800000   # 3시간
  refresh-token-validity: 7776000000   # 90일

logging:
  level:
    root: INFO
    com.fillsa.app: DEBUG
    org.springframework.web: INFO
    org.hibernate: INFO
    org.hibernate.orm.jdbc.bind: trace
    # Redis 관련 로깅
    org.springframework.data.redis: INFO
    io.lettuce.core: WARN
    io.lettuce.core.protocol: WARN

  file:
    name: logs/fillsa_api.log

oauth:
  kakao:
    client-id:
    client-secret:
    redirect-uri:
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
  google:
    client-id:
    client-secret:
    redirect-uri:
    token-uri: https://oauth2.googleapis.com/token
    user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
  # Sign in with Apple — 탈퇴 시 토큰 폐기(revoke) 전용. 로그인은 앱이 수행(서버 미관여).
  apple:
    team-id:
    key-id:
    client-id:      # iOS 앱 번들 ID
    private-key:    # AuthKey_<keyId>.p8 내용 (PEM 헤더 포함 가능)
    token-uri: https://appleid.apple.com/auth/token
    revoke-uri: https://appleid.apple.com/auth/revoke

cloud:
  r2:
    account-id:
    access-key:
    secret-key:
    bucket:
    public-url:

# FCM 발송 설정 — 서비스 계정 JSON(base64 또는 원문). 비우면 푸시 발송 비활성(부팅 무관).
fcm:
  service-account-json:

fillsa:
  security:
    actuator-path:
    swagger-path:
  ko-author-url: https://ko.wikipedia.org/wiki/
  en-author-url: https://en.wikipedia.org/wiki/
  withdraw-url: http://localhost:3000

springdoc:
  default-produces-media-type: application/json
  swagger-ui:
    enabled: true
    tags-sorter: alpha
    path:
    url:
  api-docs:
    path:
  enable-spring-security: true
  writer-with-order-by-keys: false

swagger:
  server-url: http://localhost:8080

---
# 운영(TiDB) 전용 — MySQL 드라이버의 세션 상태 왕복 제거.
# application-prod.yml(GitHub Secret PROD_YML_APP)을 수정하지 않고 여기서 덧붙인다.
# H2 테스트 프로필에 섞이면 H2 가 알 수 없는 속성으로 거부하므로 prod 로 한정한다.
#
# 2026-10-20 실측: 쿼리 없는 읽기 트랜잭션 1개 ≈ 480ms (TiDB 왕복 ≈ 80ms × 6회).
#   read only 설정 → autocommit=0 → (쿼리) → commit → autocommit=1 → read write
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    hikari:
      data-source-properties:
        # 드라이버가 세션 상태(autocommit 등)를 로컬에 기억해, 값이 같으면 서버로 보내지 않는다
        useLocalSessionState: true
        # 실행한 문장이 없으면 commit/rollback 을 서버로 보내지 않는다
        useLocalTransactionState: true
        # @Transactional(readOnly = true) 의 set read only / read write 를 서버로 보내지 않는다.
        # 읽기 전용 강제는 Hibernate(FlushMode.MANUAL)·코드 레벨에서만 유지된다.
        readOnlyPropagatesToServer: false
