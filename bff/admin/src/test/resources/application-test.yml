spring:
  application:
    name: fillsa-admin-bff
  datasource:
    url: jdbc:h2:mem:fillsa_admin_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6380

admin-jwt:
  secret: YWRtaW4tdGVzdC1zZWNyZXQta2V5LWZvci1maWxsc2EtYWRtaW4tand0LXZlcnktbG9uZy1hbmQtc2VjdXJlLWtleS1mb3ItdGVzdA==
  access-token-validity: 10800000
  refresh-token-validity: 86400000

