server:
  port: 8081

spring:
  application:
    name: fillsa-admin-bff
  # 로컬 부팅 검증용 H2 (MySQL 호환 모드). 운영 전환 시 MySQL 설정으로 교체하세요.
  datasource:
    url: jdbc:h2:mem:fillsa_admin;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
