server:
  port: 8081

spring:
  application:
    name: fillsa-admin-bff
  # 로컬 부팅 검증용 H2 (MySQL 호환 모드). 운영 전환 시 MySQL 설정으로 교체하세요.
  datasource:
    url: jdbc:h2:mem:fillsa_admin;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # 운영 안전 기본값(fail-safe). admin 은 운영에서 앱과 같은 DB(TiDB)에 붙으므로
      # Hibernate 가 스키마를 자동 변경해서는 안 된다. 스키마는 수동 DDL(docs/migration/)로만 관리한다.
      # prod yml 이 ddl-auto 를 명시하지 않아도 안전하도록 기본값을 none 으로 둔다.
      # 로컬 H2 부팅 검증은 local 프로필(application-local.yml)에서 update 로 덮어쓴다.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379

# 어드민 콘솔 CORS 허용 오리진. 콤마로 다중 지정. prod 는 application-prod.yml 에서 배포 도메인으로 override.
admin-cors:
  allowed-origins: http://localhost:5173

# 어드민 전용 JWT. bff:app 의 jwt.secret 과 반드시 다른 키를 사용해 토큰을 분리한다.
admin-jwt:
  secret: ${ADMIN_JWT_SECRET:YWRtaW4tc2VjcmV0LWtleS1mb3ItZmlsbHNhLWFkbWluLWp3dC12ZXJ5LWxvbmctYW5kLXNlY3VyZS1rZXktZGVmYXVsdA==}
  access-token-validity: 10800000    # 3시간
  refresh-token-validity: 86400000   # 1일

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
# 로컬 부팅 검증용. 인메모리 H2 라 스키마를 매번 생성해야 한다.
#   ./gradlew :bff:admin:bootRun --args='--spring.profiles.active=local'
#
# application-local.yml 은 .gitignore 대상이라 공유되지 않으므로 여기에 둔다.
spring:
  config:
    activate:
      on-profile: local
  jpa:
    hibernate:
      ddl-auto: update
