# fillsa OCI VM 리버스 프록시 (docs/deploy-plan.md §3-B)
# - Cloudflare Flexible 모드: origin 은 80(HTTP)만 수신, 인증서 불필요
# - Cloudflare 가 붙여주는 X-Forwarded-* / CF-Connecting-IP 헤더는 그대로 통과시킨다
#   (구 단일 컨테이너 시절과 동일한 헤더를 앱이 받도록 — 앱 API 동작 불변 원칙)

# 앱 API (경로·응답 불변 🔴)
server {
    listen 80;
    server_name api.fillsa.com;

    # 필사 이미지 업로드(멀티파트 2MB) 여유 — nginx 기본 1m 이면 업로드가 413 으로 깨진다
    client_max_body_size 5m;

    location / {
        proxy_pass http://fillsa-app:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}

# 어드민 API
server {
    listen 80;
    server_name admin-api.fillsa.com;

    location / {
        proxy_pass http://fillsa-admin:8081;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}

# 로그 뷰어 (dozzle) — 컨테이너 로그는 운영 정보라 basic auth 뒤에 둔다
server {
    listen 80;
    server_name logs.fillsa.com;

    auth_basic "fillsa logs";
    auth_basic_user_file /etc/nginx/conf.d/.htpasswd;

    location / {
        # 업스트림을 변수로 넘겨 기동 시점이 아니라 요청 시점에 해석한다.
        # proxy_pass http://fillsa-dozzle:8080 로 직접 쓰면 dozzle 이 없을 때
        # nginx 가 "host not found in upstream" 으로 reload 에 실패해 앱까지 같이 내려간다.
        resolver 127.0.0.11 valid=10s;
        set $dozzle_upstream http://fillsa-dozzle:8080;
        proxy_pass $dozzle_upstream;

        proxy_set_header Host $host;

        # dozzle 은 로그를 SSE 로 흘려보낸다 — 버퍼링을 끄지 않으면 실시간으로 안 보인다
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }
}

# 매칭되지 않는 Host(IP 직접 접근 등)는 차단
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
